<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audio Analyzer & Effects</title>

    <link rel="stylesheet" href="./index.css">
    <script src="./app.js" defer></script>
</head>

<body>

    <main class="container">

        <h1>Audio Analyzer</h1>

        <!-- AUDIO UPLOAD -->

        <section class="panel">

            <h2>Audio Upload</h2>

            <label for="audio-upload" class="upload-label">
                Choose an audio file
            </label>

            <input type="file" id="audio-upload" accept=".mp3,.wav,audio/mpeg,audio/wav">

            <p class="file-info" id="file-info">
                Supported formats: MP3 and WAV
            </p>

        </section>

        <!-- AUDIO PLAYER -->

        <section class="panel audio-container" id="audio-container" hidden>

            <h2 id="audio-filename"></h2>

            <audio id="audio-player" controls></audio>

        </section>

        <!-- AUDIO EFFECTS -->

        <section class="panel effects-container">

            <h2>Audio Effects</h2>

            <!-- INPUT GAIN -->

            <div class="control-group">

                <div class="control-header">
                    <label for="gain-control">Input Gain</label>
                    <span id="gain-value">1.00x</span>
                </div>

                <input type="range" id="gain-control" min="0" max="3" step="0.01" value="1">

            </div>

            <!-- DISTORTION TYPE -->

            <div class="control-group">

                <label for="distortion-type">
                    Distortion Type
                </label>

                <select id="distortion-type">

                    <option value="none">None</option>
                    <option value="hard">Hard Clipping</option>
                    <option value="soft">Soft Clipping</option>
                    <option value="tanh">Hyperbolic Tangent</option>
                    <option value="atan">Arctangent</option>
                    <option value="cubic">Cubic Distortion</option>
                    <option value="sine">Sine Wave Folding</option>
                    <option value="fuzz">Fuzz</option>
                    <option value="asymmetric">Asymmetric Distortion</option>

                </select>

            </div>

            <!-- DISTORTION DRIVE -->

            <div class="control-group">

                <div class="control-header">
                    <label for="drive-control">Distortion Drive</label>
                    <span id="drive-value">1.0x</span>
                </div>

                <input type="range" id="drive-control" min="1" max="50" step="0.1" value="1">

            </div>

            <!-- WET / DRY -->

            <div class="control-group">

                <div class="control-header">
                    <label for="mix-control">Wet / Dry Mix</label>
                    <span id="mix-value">100%</span>
                </div>

                <input type="range" id="mix-control" min="0" max="100" step="1" value="100">

            </div>

            <!-- BYPASS -->

            <div class="bypass-container">

                <label for="bypass-control">
                    Bypass Distortion
                </label>

                <input type="checkbox" id="bypass-control">

            </div>

        </section>

        <!-- SPECTROGRAM -->

        <section class="panel spectrogram-container">

            <h2>Spectrogram</h2>

            <div class="spectrogram-wrapper">

                <div class="frequency-labels">
                    <span>20 kHz</span>
                    <span>10 kHz</span>
                    <span>5 kHz</span>
                    <span>1 kHz</span>
                    <span>100 Hz</span>
                </div>

                <canvas id="spectrogram" width="1000" height="400"></canvas>

            </div>

            <div class="spectrogram-footer">
                <span>Frequency (Hz)</span>
                <span>Time →</span>
            </div>

        </section>

        <p id="app-status"></p>

    </main>

</body>

</html>
