<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audio Spectrogram</title>

    <link rel="stylesheet" href="./index.css">
    <script src="./app.js" defer></script>
</head>

<body>

    <main class="container">

        <h1>Audio Spectrogram</h1>

        <!-- AUDIO UPLOAD -->

        <div class="upload-container">

            <label for="audio-upload" class="upload-label">
                Choose an audio file
            </label>

            <input type="file" id="audio-upload" accept=".mp3,.wav,audio/mpeg,audio/wav">

            <p class="file-info" id="file-info">
                Supported formats: MP3 and WAV
            </p>

        </div>

        <!-- AUDIO PLAYER -->

        <div class="audio-container" id="audio-container" hidden>

            <h2 id="audio-filename"></h2>

            <audio id="audio-player" controls></audio>

        </div>

        <!-- SPECTROGRAM -->

        <section class="spectrogram-container">

            <h2>Spectrogram</h2>

            <div class="spectrogram-wrapper">

                <div class="frequency-labels">
                    <span>20 kHz</span>
                    <span>10 kHz</span>
                    <span>5 kHz</span>
                    <span>1 kHz</span>
                    <span>100 Hz</span>
                </div>

                <canvas id="spectrogram" width="1000" height="400"></canvas>

            </div>

            <div class="spectrogram-footer">
                <span>Frequency (Hz)</span>
                <span>Time →</span>
            </div>

        </section>

        <!-- STATUS -->

        <p id="app-status"></p>

    </main>

</body>

</html>
